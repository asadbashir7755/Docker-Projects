services:
  nginx:
    container_name: nginx
    build:
      context: ./
      dockerfile: ./nginx/Dockerfile
    ports:
      - "80:80"
    networks:
      - fypapp_network
    restart: always
    depends_on:
      backend:
        condition: service_healthy



  backend:
    container_name: backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    networks:
      - fypapp_network
    restart: always
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/health || exit 1"]
    #   interval: 5s
    #   retries: 5
    #   start_period: 20s
    healthcheck:
      test: ["CMD", "echo", "ok"]
      interval: 5s
      retries: 3
      start_period: 20s


networks:
  fypapp_network:
    driver: bridge
